[project]
name = "control-plane"
version = "0.1.0"
description = "Control Plane v0: takes a task from a backlog to a merged branch."
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20",
    "openai>=3.54.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0",
]

[project.scripts]
cplane = "control_plane.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control_plane"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls the real model endpoint; runs only with CPLANE_LIVE=1"]

[tool.coverage.run]
source = ["control_plane"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]
